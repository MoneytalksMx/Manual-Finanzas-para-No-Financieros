<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoneyTalks | Programa de Bienestar Financiero</title>
  <meta name="description" content="Manual de Finanzas para No Financieros — MoneyTalks, Programa de Bienestar Financiero.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f3f1;
      --ink: #1f1f1f;
      --muted: #6b6862;
      --brand: #2c86c7;
      --danger: #d93025;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Montserrat", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      padding: 32px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .brand img {
      height: 64px;
      width: auto;
      display: block;
    }
    .divider {
      width: 2px;
      align-self: stretch;
      min-height: 64px;
      background: var(--ink);
    }
    .tagline {
      font-weight: 600;
      font-size: 22px;
      line-height: 1.35;
      margin: 0;
    }

    /* ---------- Acceso con código ---------- */
    .gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      transition: opacity 400ms ease, transform 400ms ease;
    }
    .gate[data-leaving] { opacity: 0; transform: translateY(-8px); }
    .gate__title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .gate__msg {
      margin: 0;
      min-height: 1.4em;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: color 200ms ease;
    }
    .gate__msg[data-tone="error"] { color: var(--danger); }

    /* ---------- Contenido (después del código) ---------- */
    body[data-view="app"] {
      display: block;
      padding: 0;
    }
    body[data-view="app"] .brand {
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
      border-bottom: 1px solid #e2ded7;
    }
    body[data-view="app"] .brand img { height: 44px; }
    body[data-view="app"] .divider { min-height: 44px; }
    body[data-view="app"] .tagline { font-size: 16px; }
    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 48px;
      max-width: 1160px;
      margin: 0 auto;
      padding: 40px 24px 96px;
      animation: app-in 500ms cubic-bezier(0.23, 1, 0.32, 1) both;
    }
    .app > * { min-width: 0; }
    @keyframes app-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .app__nav {
      position: sticky;
      top: 24px;
      align-self: start;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 4px 24px 2px;
    }
    .app__nav-title {
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Basado en BranchedMenu de React Bits (reactbits.dev), portado a JS + CSS sin dependencias */
    .branched-menu {
      --bm-ink: var(--ink);
      --bm-accent: var(--brand);
      --bm-line: #d6d1c9;
      --bm-font: 14px;
      --bm-row: 36px;
      --bm-indent: 40px;
      --bm-draw: 400ms;
      --bm-fold: 300ms;
      --bm-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --bm-muted: color-mix(in srgb, var(--bm-ink) 55%, transparent);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-left: 14px;
      color: var(--bm-ink);
      font-size: var(--bm-font);
      line-height: 1.25;
    }
    .branched-menu::before {
      content: '';
      position: absolute;
      top: 8px;
      bottom: 0;
      left: 0;
      width: 2px;
      border-radius: 1px;
      background: linear-gradient(to bottom, var(--bm-line) 0%, var(--bm-line) 85%, transparent 100%);
    }
    .branched-menu__marker {
      position: absolute;
      top: -1px;
      left: 0;
      z-index: 1;
      width: 2px;
      height: 16px;
      border-radius: 1px;
      background: var(--bm-accent);
      opacity: 0;
      transition: top 220ms var(--bm-ease-out), opacity 150ms ease;
    }
    .branched-menu__marker[data-on] { opacity: 1; }
    .branched-menu__section { display: flex; flex-direction: column; }
    .branched-menu__head {
      display: flex;
      gap: 10px;
      margin: 0;
      padding: 9px 0;
      border: 0;
      background: none;
      color: var(--bm-muted);
      font: inherit;
      font-size: calc(var(--bm-font) + 1px);
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 200ms ease;
    }
    .branched-menu__num {
      flex: none;
      min-width: 1.4em;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .branched-menu__head:focus-visible,
    .branched-menu__item:focus-visible {
      outline: 2px solid var(--bm-accent);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .branched-menu__section[data-open] .branched-menu__head,
    .branched-menu__section[data-current] .branched-menu__head { color: var(--bm-ink); }
    @media (hover: hover) and (pointer: fine) {
      .branched-menu__head:hover { color: var(--bm-ink); }
    }
    .branched-menu__body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--bm-fold) var(--bm-ease-out);
    }
    .branched-menu__section[data-open] .branched-menu__body { grid-template-rows: 1fr; }
    .branched-menu__fold { min-height: 0; overflow: hidden; }
    .branched-menu__tree { position: relative; padding: 6px 0; }
    .branched-menu__lines {
      position: absolute;
      top: 0;
      left: 0;
      overflow: visible;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .branched-menu__section[data-open] .branched-menu__lines {
      opacity: 1;
      transition: opacity 250ms ease 100ms;
    }
    .branched-menu__base,
    .branched-menu__reach {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .branched-menu__base { stroke: var(--bm-line); }
    .branched-menu__reach {
      stroke: var(--bm-accent);
      transition: stroke-dashoffset var(--bm-draw) var(--bm-ease-out);
    }
    .branched-menu__item {
      display: flex;
      align-items: center;
      width: 100%;
      height: var(--bm-row);
      margin: 0;
      padding: 0 0 0 var(--bm-indent);
      border: 0;
      background: none;
      color: var(--bm-muted);
      font: inherit;
      text-align: left;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 200ms ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .branched-menu__item:hover { color: var(--bm-ink); }
    }
    .branched-menu__item[data-active] { color: var(--bm-accent); font-weight: 600; }
    .branched-menu__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Capítulo */
    .chapter { animation: app-in 400ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    .chapter__kicker {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .chapter__title {
      margin: 0 0 32px;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 600;
      line-height: 1.2;
      text-wrap: balance;
    }
    .case-section {
      scroll-margin-top: 24px;
      padding: 24px 0;
      border-top: 1px solid #e2ded7;
    }
    .case-section h3 {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 600;
    }
    .case-section__n {
      flex: none;
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .case-section__pending {
      margin: 0;
      padding: 18px 20px;
      border: 1.5px dashed #d6d1c9;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }
    .case-body {
      max-width: 68ch;
      font-size: 15.5px;
      font-weight: 500;
      line-height: 1.7;
      color: #2b2a27;
    }
    .case-body > p { margin: 0 0 14px; }
    .case-body > p:last-child { margin-bottom: 0; }
    .case-head {
      display: grid;
      gap: 6px;
      margin: 0 0 14px;
      font-size: 14px;
    }
    .case-head div { display: flex; gap: 10px; }
    .case-head dt { min-width: 76px; font-weight: 600; color: var(--muted); }
    .case-head dd { margin: 0; font-weight: 600; }
    .case-head__title {
      margin: 0;
      font-size: clamp(19px, 2.6vw, 23px);
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink);
      text-wrap: balance;
    }
    .case-table {
      max-width: 100%;
      margin: 4px 0 12px;
      overflow-x: auto;
      border: 1px solid #e2ded7;
      border-radius: 12px;
      background: #fbfaf8;
    }
    .case-table:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .case-table table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 13.5px;
      line-height: 1.45;
    }
    .case-table th, .case-table td {
      padding: 10px 14px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid #ebe7e1;
    }
    .case-table tbody tr:last-child th, .case-table tbody tr:last-child td { border-bottom: 0; }
    .case-table thead th {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      background: #f1eee9;
    }
    .case-table tbody th { font-weight: 600; color: var(--ink); }
    .case-table td { font-variant-numeric: tabular-nums; }
    .case-note {
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
    }
    .case-questions {
      margin: 0;
      padding-left: 1.4em;
    }
    .case-questions li { margin: 0 0 10px; padding-left: 4px; }
    .case-questions li::marker { font-weight: 600; color: var(--brand); }
    .case-sources {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .case-sources li { display: grid; gap: 3px; }
    .case-sources a {
      color: var(--brand);
      font-size: 12.5px;
      overflow-wrap: anywhere;
      text-underline-offset: 2px;
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: minmax(0, 1fr); gap: 32px; padding: 24px 16px 72px; }
      .app__nav { position: static; max-height: none; overflow: visible; }
    }

    /* Basado en CodeSlots de React Bits (reactbits.dev), portado a JS + CSS sin dependencias */
    .code-slots {
      --cs-gap: 8px;
      --cs-size: min(46px, calc((100vw - 32px - 8 * var(--cs-gap)) / 9));
      --cs-height: calc(var(--cs-size) * 1.18);
      --cs-radius: min(12px, calc(var(--cs-size) / 2));
      --cs-font: calc(var(--cs-size) * 0.5);
      --cs-pitch: calc(var(--cs-size) + var(--cs-gap));
      --cs-slot: #e6e3de;
      --cs-accent: var(--brand);
      --cs-digit: #ffffff;
      --cs-ease-spring: cubic-bezier(0.3, 1.35, 0.6, 1);
      --cs-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      display: inline-block;
    }
    .code-slots__row {
      position: relative;
      display: inline-flex;
      gap: var(--cs-gap);
      cursor: text;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .code-slots__input {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      opacity: 0;
      cursor: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    .code-slots__slot {
      position: relative;
      width: var(--cs-size);
      height: var(--cs-height);
      border-radius: var(--cs-radius);
      overflow: hidden;
      background: var(--cs-slot);
      transition: background-color 200ms ease;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .code-slots__row[data-status="idle"]:hover .code-slots__slot:not([data-active]) {
        background: color-mix(in srgb, var(--ink) 4%, var(--cs-slot));
      }
    }
    .code-slots__slot[data-active] {
      background: color-mix(in srgb, var(--ink) 9%, var(--cs-slot));
    }
    .code-slots__fill {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--cs-accent);
      transform: scale(0);
      transition: transform 300ms var(--cs-ease-out) var(--d, 0ms), background-color 200ms ease;
    }
    .code-slots__slot[data-filled] .code-slots__fill {
      transform: scale(1);
      transition-timing-function: var(--cs-ease-spring), ease;
    }
    .code-slots__digit {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      color: var(--cs-digit);
      font-size: var(--cs-font);
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transform: translateY(8px);
      transition: transform 300ms var(--cs-ease-out) var(--d, 0ms), opacity 300ms var(--cs-ease-out) var(--d, 0ms);
    }
    .code-slots__slot[data-filled] .code-slots__digit {
      opacity: 1;
      transform: translateY(0);
      transition-timing-function: var(--cs-ease-spring), var(--cs-ease-out);
    }
    /* Error: las casillas se tiñen de rojo y se vacían en cascada */
    .code-slots__row[data-status="error"] .code-slots__slot {
      background: color-mix(in srgb, var(--danger) 18%, var(--cs-slot));
    }
    .code-slots__row[data-status="error"] .code-slots__fill { background: var(--danger); }
    /* Éxito: los caracteres se hunden y una franja azul se abre desde el centro con la palomita */
    .code-slots__row[data-status="success"] .code-slots__digit {
      opacity: 0;
      transform: translateY(calc(var(--cs-height) * 0.5));
      transition: transform 300ms var(--cs-ease-out) var(--sd, 0ms), opacity 180ms ease var(--sd, 0ms);
    }
    .code-slots__wash {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      border-radius: var(--cs-radius);
      background: var(--cs-accent);
      color: var(--cs-digit);
      pointer-events: none;
      clip-path: inset(0 50% round var(--cs-radius));
      transition: clip-path 300ms var(--cs-ease-out);
    }
    .code-slots__row[data-status="success"] .code-slots__wash {
      clip-path: inset(0 0% round var(--cs-radius));
    }
    .code-slots__check {
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(8px) scale(0.85);
      transition: transform 350ms var(--cs-ease-spring), opacity 250ms ease;
    }
    .code-slots__check svg { width: calc(var(--cs-size) * 0.6); height: calc(var(--cs-size) * 0.6); }
    .code-slots__row[data-status="success"] .code-slots__check {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 280ms;
    }
    .code-slots__caret {
      position: absolute;
      z-index: 3;
      top: 25%;
      left: calc(var(--cs-size) / 2 - 0.75px);
      width: 1.5px;
      height: 50%;
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(var(--a, 0) * var(--cs-pitch)));
      transition: transform 260ms var(--cs-ease-out);
    }
    .code-slots__caret[data-show] { opacity: 1; }
    .code-slots__caret-line {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--ink);
      animation: code-slots-blink 1s linear infinite;
    }
    @keyframes code-slots-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .code-slots *, .gate, .app, .chapter, .branched-menu * {
        transition-duration: 1ms !important;
        animation: none !important;
      }
    }
    @media (max-width: 560px) {
      body { gap: 44px; }
      .brand { flex-direction: column; gap: 18px; text-align: center; }
      .brand img { height: 52px; }
      .divider { width: 64px; height: 2px; min-height: 0; align-self: center; }
      .tagline { font-size: 18px; }
      .code-slots { --cs-gap: 6px; }
      body[data-view="app"] .brand { flex-direction: row; gap: 14px; text-align: left; padding: 16px; }
      body[data-view="app"] .brand img { height: 34px; }
      body[data-view="app"] .divider { width: 2px; height: auto; min-height: 34px; align-self: stretch; }
      body[data-view="app"] .tagline { font-size: 13px; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <img src="logo.png" alt="MoneyTalks">
    <span class="divider" aria-hidden="true"></span>
    <p class="tagline">Programa de<br>Bienestar Financiero</p>
  </header>

  <main id="main">
    <section class="gate" id="gate">
      <p class="gate__title" id="gate-title">Ingresa tu código de acceso</p>
      <div class="code-slots">
        <div class="code-slots__row" id="slots" data-status="idle">
          <input class="code-slots__input" id="code-input" type="text" inputmode="text"
                 autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"
                 maxlength="9" aria-labelledby="gate-title" aria-describedby="gate-status" autofocus>
          <span class="code-slots__wash" aria-hidden="true">
            <span class="code-slots__check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14l3.5 3.5L19 7"/></svg>
            </span>
          </span>
          <span class="code-slots__caret" aria-hidden="true"><span class="code-slots__caret-line"></span></span>
        </div>
      </div>
      <p class="gate__msg" id="gate-msg"></p>
      <span class="sr-only" id="gate-status" aria-live="polite"></span>
    </section>

    <div class="app" id="app" hidden>
      <aside class="app__nav">
        <p class="app__nav-title">Manual de Finanzas para No Financieros</p>
        <nav class="branched-menu" id="menu" aria-label="Capítulos">
          <span class="branched-menu__marker" aria-hidden="true"></span>
        </nav>
      </aside>
      <article id="chapter" aria-live="polite"></article>
    </div>
  </main>

  <script src="casos.js"></script>
  <script>
    // Menú de capítulos y casos de cada uno
    (function () {
      var CHAPTERS = [
        'Todos tomamos decisiones financieras',
        'Las tres preguntas de un negocio',
        'Estado de Resultados',
        'Balance General',
        'Flujo de Efectivo',
        'Tres estados, una sola historia',
        'Costos',
        'Las palancas del resultado',
        'El presupuesto',
        'Forecast y control presupuestal',
        '¿Cómo leer una empresa?',
        'Las señales de salud de una empresa',
        'Punto de equilibrio',
        'Construir un caso de negocio',
        'El valor del dinero en el tiempo',
        'VAN, TIR y Payback',
        'Riesgo, escenarios y creación de valor'
      ];
      var SECTIONS = [
        { id: 'encabezado', label: 'Encabezado' },
        { id: 'historia', label: 'La historia' },
        { id: 'numeros', label: 'Los números clave' },
        { id: 'manual', label: 'Qué tiene que ver con tu manual' },
        { id: 'pensar', label: 'Para pensar' },
        { id: 'latas', label: 'En una planta de latas' },
        { id: 'fuentes', label: 'Fuentes' }
      ];
      var PAD = 6, ROW = 36, TRUNK = 14, INDENT = 40, MARK = 16;
      var R = Math.min(10, ROW / 2 - 2), END_X = INDENT - 8;
      var NS = 'http://www.w3.org/2000/svg';
      function rowY(k) { return PAD + k * ROW + ROW / 2; }
      function branchD(k) { return 'M ' + TRUNK + ' ' + (rowY(k) - R) + ' A ' + R + ' ' + R + ' 0 0 0 ' + (TRUNK + R) + ' ' + rowY(k) + ' H ' + END_X; }

        h2.className = 'chapter__title';
        h2.textContent = CHAPTERS[i];

        wrap.appendChild(h2);
        var data = (window.MT_CASES || []).filter(function (c) { return c.n === i; })[0];
        SECTIONS.forEach(function (s, k) {

  <script>
    (function () {
      var LENGTH = 9;
      // SHA-256 del código de acceso (no se guarda el código en texto plano)
      var CODE_HASH = '0e883e13d45e6db7e51c9e9f1b0b810172c72381dcb757b921606d51a3be56f8';
      var CASCADE = 20, SETTLE = 300;

      var gate = document.getElementById('gate');
      var row = document.getElementById('slots');
      var input = document.getElementById('code-input');
      var caret = row.querySelector('.code-slots__caret');
      var msg = document.getElementById('gate-msg');
      var status = document.getElementById('gate-status');

      // El código se pide en cada visita: se borra el acceso que guardaban versiones anteriores
      try { localStorage.removeItem('mt-manual-acceso'); } catch (e) {}
      function showWelcome() {
        gate.hidden = true;
        window.mtShowApp();
      }

      var slots = [], chars = [], active = 0, state = 'idle', focused = false;
      for (var i = 0; i < LENGTH; i++) {
        var s = document.createElement('span');
        s.className = 'code-slots__slot';
        s.setAttribute('aria-hidden', 'true');
        s.innerHTML = '<span class="code-slots__fill"></span><span class="code-slots__digit"></span>';
        s.style.setProperty('--sd', (60 + i * 30) + 'ms');
        row.insertBefore(s, row.querySelector('.code-slots__wash'));
        slots.push(s);
        chars.push('');
      }

      function clean(raw) { return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
      function firstEmpty() { var k = chars.indexOf(''); return k === -1 ? LENGTH - 1 : k; }
      function render() {
        slots.forEach(function (s, k) { s.toggleAttribute('data-active', focused && k === active && state === 'idle'); });
        caret.style.setProperty('--a', active);
        caret.toggleAttribute('data-show', focused && state === 'idle' && !chars[active]);
        var n = chars.filter(Boolean).length;
        status.textContent = state === 'success' ? 'Código aceptado' : n + ' de ' + LENGTH + ' caracteres';
      }
      function land(k, ch, delay) {
        var s = slots[k];
        s.style.setProperty('--d', delay + 'ms');
        if (s.hasAttribute('data-filled')) { s.removeAttribute('data-filled'); void s.offsetWidth; }
        s.querySelector('.code-slots__digit').textContent = ch;
        s.setAttribute('data-filled', '');
      }
      function clearSlot(k, delay) {
        slots[k].style.setProperty('--d', (delay || 0) + 'ms');
        slots[k].removeAttribute('data-filled');
        chars[k] = '';
      }
      function insert(raw, from) {
        var c = clean(raw);
        if (!c || state !== 'idle') return;
        if (msg.dataset.tone) { msg.textContent = ''; delete msg.dataset.tone; }
        var k = from === undefined ? active : from;
        for (var j = 0; j < c.length && k < LENGTH; j++, k++) {
          chars[k] = c[j];
          land(k, c[j], j * CASCADE);
        }
        active = Math.min(k, LENGTH - 1);
        render();
        if (chars.every(Boolean)) verify(chars.join(''));
      }

      function sha256(text) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
          return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        });
      }
      function verify(code) {
        state = 'checking';
        render();
        sha256(code).then(function (h) { h === CODE_HASH ? succeed() : fail(); }, fail);
      }
      function succeed() {
        state = 'success';
        row.dataset.status = 'success';
        input.blur();
        input.readOnly = true;
        msg.textContent = '';
        render();
        setTimeout(function () {
          gate.setAttribute('data-leaving', '');
          setTimeout(showWelcome, 400);
        }, 900);
      }
      function fail() {
        state = 'error';
        row.dataset.status = 'error';
        msg.dataset.tone = 'error';
        msg.textContent = 'Código incorrecto. Inténtalo de nuevo.';
        render();
        setTimeout(function () {
          var filled = [];
          chars.forEach(function (c, k) { if (c) filled.push(k); });
          filled.reverse().forEach(function (k, n) { clearSlot(k, n * CASCADE); });
          active = 0;
          caret.style.setProperty('--a', 0);
          setTimeout(function () {
            state = 'idle';
            row.dataset.status = 'idle';
            render();
          }, (filled.length - 1) * CASCADE + SETTLE);
        }, 450);
      }

      input.addEventListener('keydown', function (e) {
        if (state !== 'idle' || e.metaKey || e.ctrlKey || e.altKey) return;
        var key = e.key;
        if (/^[a-zA-Z0-9]$/.test(key)) {
          e.preventDefault();
          insert(key);
        } else if (key === 'Backspace') {
          e.preventDefault();
          if (chars[active]) clearSlot(active);
          else if (active > 0) { active -= 1; clearSlot(active); }
          render();
        } else if (key === 'Delete') {
          e.preventDefault(); clearSlot(active); render();
        } else if (key === 'ArrowLeft') {
          e.preventDefault(); active = Math.max(active - 1, 0); render();
        } else if (key === 'ArrowRight') {
          e.preventDefault(); active = Math.min(active + 1, firstEmpty()); render();
        } else if (key === 'Home') {

        } else if (key === 'End') {

      });

    })();
