<style>
:root{
  --bg:#F4F3F1;--ink:#1F1F1F;--muted:#6B6862;
  --env-red:#AA1124;--env-red-dark:#921327;--env-gray:#999998;--env-ink:#262626;
  --brand:var(--env-red);--danger:#C2410C;
  --line:#E2DED7;--line-soft:#EBE7E1;--table-bg:#FBFAF8;--head:#F1EEE9;
  --ok:#2E7D4F;--alerta:var(--danger);--rojo:var(--env-red);--carbon:var(--env-ink);
  --ease:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Montserrat",system-ui,sans-serif;font-weight:500;background:var(--bg);color:var(--ink);line-height:1.5;font-variant-numeric:tabular-nums;border-top:4px solid var(--env-red);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* Encabezado de marca: MoneyTalks | lema | Envases, con el mismo ancho */
.topbar{padding:18px 24px;border-bottom:1px solid var(--line);background:#F7F6F4;display:flex;justify-content:center}
.brand{--bw:150px;display:grid;grid-template-columns:var(--bw) auto var(--bw) auto var(--bw);align-items:center;justify-items:center;gap:calc(var(--bw)*0.13)}
.brand__logo{display:block;width:var(--bw);height:auto}
.brand__logo--envases{width:calc(var(--bw)*0.84)}
.divider{width:2px;height:calc(var(--bw)*0.3);background:var(--ink)}
.tagline{font-weight:600;font-size:calc(var(--bw)/10);line-height:1.3;white-space:nowrap;text-align:left}
main{flex:1}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 56px;animation:fade-in 400ms var(--ease) both}
.fac .wrap{max-width:1160px;padding:32px 24px 56px}
@keyframes fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.kick{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--env-red)}
h1{font-size:23px;font-weight:600;line-height:1.3;margin-top:4px}
.fac h1{font-size:30px}
h2{font-size:18px;font-weight:600;margin:20px 0 8px}
.fac h2{font-size:21px}
p.sub{color:var(--muted);font-size:15px;line-height:1.6;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
label small{font-weight:500;color:var(--muted)}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:18px;font-weight:500;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);transition:border-color 200ms ease}
input:focus{outline:none;border-color:var(--env-ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #D6D1C9;background:#fff;border-radius:999px;padding:9px 15px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink);transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease}
.chip:hover{border-color:var(--env-ink)}
.chip.on{color:#fff;border-color:transparent}
button.btn{display:block;width:100%;font:inherit;font-size:16px;font-weight:600;padding:13px;border:0;border-radius:12px;background:var(--env-ink);color:#fff;cursor:pointer;margin-top:18px;transition:background-color 200ms ease}
button.btn:hover{background:var(--env-red)}
button.btn:disabled{opacity:.5;cursor:default;background:var(--env-ink)}
button.btn.sec,button.btn.ghost{background:#E9E6E1;color:var(--ink)}
button.btn.sec:hover,button.btn.ghost:hover{background:#DEDAD3}
button.btn.danger{background:var(--danger)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.muted{color:var(--muted)}
.msg{border-radius:14px;padding:13px 16px;margin-top:12px;font-size:14.5px;line-height:1.55}
.msg.ok{background:#EAF3EE;color:#1E5A37}
.msg.err{background:#FBEDE6;color:#8A2E08;border-left:4px solid var(--danger)}
.msg.warn{background:#FBF1E6;color:#7A3B0A}
.msg.info{background:#ECE9E4;color:var(--env-ink)}
.msg ul{margin:6px 0 0 18px}
.msg li{margin-top:4px}
.mesa-tag{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--table-bg)}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;background:var(--head);border-bottom:1px solid var(--line)}
td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line-soft)}
th:first-child,td:first-child{text-align:left}
.card:has(> table){padding:0;overflow-x:auto}
.fac table{font-size:20px}
.fac th{font-size:12px;padding:10px 12px}
.fac td{padding:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-top:6px solid}
.st .n{font-weight:600;font-size:18px;line-height:1.3}
.st .s{font-size:14px;margin-top:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar button.btn{width:auto;margin-top:0;padding:11px 18px;font-size:15px}
.mini{margin-top:10px;font:inherit;font-size:12.5px;font-weight:600;padding:6px 10px;border:0;border-radius:10px;background:#E9E6E1;color:var(--ink);cursor:pointer;transition:background-color 200ms ease}
.mini:hover{background:#DEDAD3}
h3.gest{font-size:16px;font-weight:600;margin:20px 0 6px;padding-top:14px;border-top:1px solid var(--line-soft)}
select.mover{font:inherit;font-size:14px;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
#qr{background:#fff;padding:14px;border-radius:14px;border:1px solid var(--line);display:inline-block}
.small{font-size:13px}
a{color:var(--env-red)}
.pts{font-weight:700;color:var(--env-red)}
.site-footer{background:var(--env-ink);color:#D9D9D9}
.site-footer__band{height:6px;background:linear-gradient(90deg,var(--env-red) 0%,var(--env-red-dark) 100%)}
.site-footer__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 40px;max-width:1160px;margin:0 auto;padding:32px 24px}
.site-footer img{display:block;height:30px;width:auto}
.site-footer p{font-size:13px;line-height:1.6}
.site-footer strong{color:#fff;font-weight:600}
@media (max-width:900px){.cols{grid-template-columns:1fr}.grid5{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){
  .topbar{padding:14px 12px}
  .brand{--bw:min(96px,calc((100vw - 24px - 4px - 40px)/3));gap:10px}
  .divider{width:1.5px;height:calc(var(--bw)*0.34)}
  .site-footer__inner{padding:28px 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation:none!important}}
    /* Basado en CodeSlots de React Bits (reactbits.dev), portado a JS + CSS sin dependencias */
    .code-slots {
      --cs-gap: 8px;
      --cs-size: min(56px, calc((100vw - 32px - 5 * var(--cs-gap)) / 6));
      --cs-height: calc(var(--cs-size) * 1.18);
      --cs-radius: min(12px, calc(var(--cs-size) / 2));
      --cs-font: calc(var(--cs-size) * 0.5);
      --cs-pitch: calc(var(--cs-size) + var(--cs-gap));
      --cs-slot: #e6e3de;
      --cs-accent: var(--env-ink);
      --cs-digit: #ffffff;
      --cs-ease-spring: cubic-bezier(0.3, 1.35, 0.6, 1);
      --cs-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      display: inline-block;
    }
    .code-slots__row {
      position: relative;
      display: inline-flex;
      gap: var(--cs-gap);
      cursor: text;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .code-slots__input {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      opacity: 0;
      cursor: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    .code-slots__slot {
      position: relative;
      width: var(--cs-size);
      height: var(--cs-height);
      border-radius: var(--cs-radius);
      overflow: hidden;
      background: var(--cs-slot);
      transition: background-color 200ms ease;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .code-slots__row[data-status="idle"]:hover .code-slots__slot:not([data-active]) {
        background: color-mix(in srgb, var(--ink) 4%, var(--cs-slot));
      }
    }
    .code-slots__slot[data-active] {
      background: color-mix(in srgb, var(--ink) 9%, var(--cs-slot));
    }
    .code-slots__fill {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--cs-accent);
      transform: scale(0);
      transition: transform 300ms var(--cs-ease-out) var(--d, 0ms), background-color 200ms ease;
    }
    .code-slots__slot[data-filled] .code-slots__fill {
      transform: scale(1);
      transition-timing-function: var(--cs-ease-spring), ease;
    }
    .code-slots__digit {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      color: var(--cs-digit);
      font-size: var(--cs-font);
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transform: translateY(8px);
      transition: transform 300ms var(--cs-ease-out) var(--d, 0ms), opacity 300ms var(--cs-ease-out) var(--d, 0ms);
    }
    .code-slots__slot[data-filled] .code-slots__digit {
      opacity: 1;
      transform: translateY(0);
      transition-timing-function: var(--cs-ease-spring), var(--cs-ease-out);
    }
    /* Error: las casillas se tiñen de rojo y se vacían en cascada */
    .code-slots__row[data-status="error"] .code-slots__slot {
      background: color-mix(in srgb, var(--danger) 18%, var(--cs-slot));
    }
    .code-slots__row[data-status="error"] .code-slots__fill { background: var(--danger); }
    /* Éxito: los caracteres se hunden y una franja azul se abre desde el centro con la palomita */
    .code-slots__row[data-status="success"] .code-slots__digit {
      opacity: 0;
      transform: translateY(calc(var(--cs-height) * 0.5));
      transition: transform 300ms var(--cs-ease-out) var(--sd, 0ms), opacity 180ms ease var(--sd, 0ms);
    }
    .code-slots__wash {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      border-radius: var(--cs-radius);
      background: var(--brand);
      color: var(--cs-digit);
      pointer-events: none;
      clip-path: inset(0 50% round var(--cs-radius));
      transition: clip-path 300ms var(--cs-ease-out);
    }
    .code-slots__row[data-status="success"] .code-slots__wash {
      clip-path: inset(0 0% round var(--cs-radius));
    }
    .code-slots__check {
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(8px) scale(0.85);
      transition: transform 350ms var(--cs-ease-spring), opacity 250ms ease;
    }
    .code-slots__check svg { width: calc(var(--cs-size) * 0.6); height: calc(var(--cs-size) * 0.6); }
    .code-slots__row[data-status="success"] .code-slots__check {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 280ms;
    }
    .code-slots__caret {
      position: absolute;
      z-index: 3;
      top: 25%;
      left: calc(var(--cs-size) / 2 - 0.75px);
      width: 1.5px;
      height: 50%;
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(var(--a, 0) * var(--cs-pitch)));
      transition: transform 260ms var(--cs-ease-out);
    }
    .code-slots__caret[data-show] { opacity: 1; }
    .code-slots__caret-line {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--ink);
      animation: code-slots-blink 1s linear infinite;
    }
    @keyframes code-slots-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

.pin{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:48px 0 24px;transition:opacity 400ms ease,transform 400ms ease}
.pin[data-leaving]{opacity:0;transform:translateY(-8px)}
.pin__title{font-size:15px;font-weight:600}
.pin__msg{min-height:1.4em;font-size:13px;color:var(--muted)}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<body>
<div class="topbar">
  <header class="brand">
    <img class="brand__logo" src="../logo.png" alt="MoneyTalks">
    <span class="divider" aria-hidden="true"></span>
    <p class="tagline">Programa de<br>Bienestar Financiero</p>
    <span class="divider" aria-hidden="true"></span>
    <img class="brand__logo brand__logo--envases" src="../img/envases.webp" alt="Envases">
  </header>
</div>
<main><div class="wrap" id="app" aria-live="polite"><p class="muted">Cargando…</p></div></main>
<footer class="site-footer">
  <div class="site-footer__band" aria-hidden="true"></div>
  <div class="site-footer__inner">
    <img src="../img/envases-blanco.webp" alt="Envases">
    <p><strong>Manual de Finanzas para No Financieros</strong><br>Programa de Bienestar Financiero de MoneyTalks para Envases</p>
  </div>
</footer>

<script src="vendor/supabase-2.45.4.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="motor.js"></script>
<script src="exportar.js"></script>
<script>
const SB = supabase.createClient('https://stnzwajznjdcmjkrewyk.supabase.co', 'sb_publishable_Xg7V0CtvQ-Ws7WDwQZ9laQ_32ZZP_7e');
const MESAS = [null, ['Los Politos', '#1F6DA5'], ['Osos EUM', '#2E7D4F'], ['Actirent Envases', '#D9822B'], ['Equipo Dinamita', '#6B4FA0'], ['Los rentables', '#C0392B']];
const ROLES = ['Vocero', 'Moderador', 'Tesorero', 'Integrante'];
const CAMPOS = { cobros: 'Cobros del mes', proveedor: 'Pago al proveedor', cajaFinal: 'Caja al final del mes', utilidad: 'Utilidad del mes' };
const q = new URLSearchParams(location.search);
const FAC = q.get('modo') === 'facilitador';
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const money = n => (n < 0 ? '−$' : '$') + Math.abs(n);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('caja_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('caja_' + k, JSON.stringify(v)); } catch (e) {} }
};
let cfg = store.get('cfg') || {};
if (q.get('p')) cfg.partida = q.get('p').toUpperCase();
if (!cfg.partida) cfg.partida = 'EU-S2';
let partida = null, mesa = null, jugadores = [], enviando = false, armado = false, timer = null, borrador = {}, aviso = '', avisoHasta = 0, tick = 0;
const avisar = t => { aviso = t; avisoHasta = Date.now() + 30000; };
// Id aleatorio de este celular: decide quién es el vocero de cada equipo
const DISPOSITIVO = (() => {
  const nuevo = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).replace(/-/g, '');
  try { let id = localStorage.getItem('caja_dispositivo'); if (!id) { id = nuevo(); localStorage.setItem('caja_dispositivo', id); } return id; } catch (e) { return nuevo(); }
})();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nombreDe = id => { const j = jugadores.find(x => x.dispositivo === id); return j ? j.nombre : ''; };

function mesaTag(n) { const [c, h] = MESAS[n]; return `<span class="mesa-tag"><span class="dot" style="background:${h}"></span>${c}</span>`; }

async function cargarPartida(code) {
  const { data, error } = await SB.from('caja_partidas').select('*').eq('codigo', code).maybeSingle();
  if (error) throw error; return data;
}
async function cargarMesa(p = cfg.partida, n = cfg.mesa) {
  const { data, error } = await SB.from('caja_mesas').select('*').eq('partida', p).eq('mesa', n).maybeSingle();
  if (error) throw error;
  if (data) return data;
  await SB.from('caja_mesas').upsert({ partida: p, mesa: n, estado: Caja.estadoInicial() }, { onConflict: 'partida,mesa', ignoreDuplicates: true });
  const r = await SB.from('caja_mesas').select('*').eq('partida', p).eq('mesa', n).maybeSingle();
  if (r.error) throw r.error; return r.data;
}
// La base de datos decide: solo se registra si el equipo no tiene vocero o ya es este celular
async function tomarVocero(p, n) {
  const { data, error } = await SB.from('caja_mesas').update({ vocero_id: DISPOSITIVO, vocero_desde: new Date().toISOString() })
    .eq('partida', p).eq('mesa', n).or(`vocero_id.is.null,vocero_id.eq.${DISPOSITIVO}`).select('mesa');
  if (error) throw error; return data.length === 1;
}
async function soltarVocero(p, n) {
  await SB.from('caja_mesas').update({ vocero_id: null, vocero_desde: null }).eq('partida', p).eq('mesa', n).eq('vocero_id', DISPOSITIVO);
}
async function guardarJugador(rol) {
  await SB.from('caja_jugadores').update({ rol, visto_at: new Date().toISOString() }).eq('partida', cfg.partida).eq('dispositivo', DISPOSITIVO);
}

/* ---------- Celular: unirse ---------- */
function vistaUnirse(err) {
  app.innerHTML = `
  <header class="top"><div><div class="kick">Finanzas para No Financieros · Sesión 2</div><h1>La caja de la planta</h1></div></header>
  <p class="sub">Escribe tu nombre y elige tu equipo y tu rol. El vocero captura la decisión y los números; todo el equipo hace las cuentas en papel.</p>
  <div class="card">
    <label for="nombre">Tu nombre</label><input type="text" id="nombre" maxlength="40" autocomplete="given-name" value="${esc(cfg.nombre || '')}">
    <label>Equipo</label><div class="chips" id="mesas">${[1,2,3,4,5].map(n => `<button class="chip" data-m="${n}">${MESAS[n][0]}</button>`).join('')}</div>
    <label>Tu rol hoy</label><div class="chips" id="roles">${ROLES.map(r => `<button class="chip" data-r="${r}">${r}</button>`).join('')}</div>
    <p class="small muted" style="margin-top:8px">Solo una persona por equipo entra como vocero. Los demás eligen otro rol.</p>
    <label>Código de la partida <small>(lo da el facilitador)</small></label><input type="text" id="cod" value="${cfg.partida}" autocapitalize="characters">
    ${err ? `<div class="msg err">${err}</div>` : ''}
    <div id="paso-entrar"><button class="btn" id="entrar">Entrar</button></div>
  </div>`;
  let m = cfg.mesa, r = cfg.rol;
  const pintar = () => {
    document.querySelectorAll('#mesas .chip').forEach(b => { const on = +b.dataset.m === m; b.classList.toggle('on', on); b.style.background = on ? MESAS[+b.dataset.m][1] : ''; });
    document.querySelectorAll('#roles .chip').forEach(b => { const on = b.dataset.r === r; b.classList.toggle('on', on); b.style.background = on ? 'var(--carbon)' : ''; });
  };
  pintar();
  $('#mesas').onclick = e => { if (e.target.dataset.m) { m = +e.target.dataset.m; pintar(); } };
  $('#roles').onclick = e => { if (e.target.dataset.r) { r = e.target.dataset.r; pintar(); } };
  const anterior = { partida: cfg.partida, mesa: cfg.mesa };
  // Primer clic: revisa los datos y pide confirmar el equipo y el rol
  $('#entrar').onclick = () => {
    const code = $('#cod').value.trim().toUpperCase(), nombre = $('#nombre').value.trim().replace(/\s+/g, ' ');
    cfg.nombre = nombre; cfg.mesa = m; cfg.rol = r; cfg.partida = code;
    if (!nombre) return vistaUnirse('Escribe tu nombre.');
    if (!m || !r) return vistaUnirse('Elige tu equipo y tu rol.');
    $('#paso-entrar').innerHTML = `<div class="msg info" style="border-left:6px solid ${MESAS[m][1]}">Vas a entrar a <b>${MESAS[m][0]}</b> como <b>${r.toLowerCase()}</b>, con el nombre <b>${esc(nombre)}</b>. ¿Es correcto?</div>
      <button class="btn" id="si-entrar">Sí, entrar</button><button class="btn sec" id="no-entrar" style="margin-top:8px">Cambiar</button>`;
    $('#no-entrar').onclick = () => vistaUnirse();
    $('#si-entrar').onclick = () => entrar(code, nombre);
  };
  const entrar = async (code, nombre) => {
    $('#si-entrar').disabled = true; $('#no-entrar').disabled = true;
    try {
      const p = await cargarPartida(code);
      if (!p) return vistaUnirse('Ese código no existe. Revísalo con el facilitador.');
      const fila = await cargarMesa(code, m);
      if (r === 'Vocero') {
        if (!(await tomarVocero(code, m))) {
          const { data } = await SB.from('caja_jugadores').select('nombre').eq('partida', code).eq('dispositivo', fila.vocero_id || '').maybeSingle();
          cfg.rol = null;
          return vistaUnirse(`${data ? esc(data.nombre) : 'Alguien más'} ya tiene el rol de vocero en ${MESAS[m][0]}. Elige otro rol.`);
        }
      } else if (fila.vocero_id === DISPOSITIVO) await soltarVocero(code, m);
      // Si este celular era vocero de otro equipo, deja ese lugar libre
      if (anterior.mesa && (anterior.mesa !== m || anterior.partida !== code)) await soltarVocero(anterior.partida, anterior.mesa);
      const j = await SB.from('caja_jugadores').upsert({ partida: code, dispositivo: DISPOSITIVO, mesa: m, nombre, rol: r, visto_at: new Date().toISOString() }, { onConflict: 'partida,dispositivo' });
      if (j.error) throw j.error;
      cfg = { partida: code, mesa: m, rol: r, nombre }; store.set('cfg', cfg); aviso = ''; avisoHasta = 0; iniciarMesa();
    } catch (e) { vistaUnirse('No hay conexión. Sigan con la hoja de papel y vuelvan a intentar.'); }
  };
}

/* ---------- Celular: mesa ---------- */
function iniciarMesa() { clearInterval(timer); armado = false; refrescarMesa(); timer = setInterval(refrescarMesa, 3000); }

async function refrescarMesa() {
  if (enviando) return;
  try {
    const p = await cargarPartida(cfg.partida);
    if (!p) { clearInterval(timer); return vistaUnirse('El facilitador reinició o cerró la partida. Vuelvan a entrar.'); }
    const todos = await SB.from('caja_jugadores').select('dispositivo,nombre,rol,mesa').eq('partida', cfg.partida);
    if (todos.error) throw todos.error;
    const yo = todos.data.find(j => j.dispositivo === DISPOSITIVO);
    if (!yo) { clearInterval(timer); partida = mesa = null; return vistaUnirse('El facilitador reinició la partida. Vuelve a entrar.'); }
    if (yo.mesa !== cfg.mesa) {
      cfg.mesa = yo.mesa; cfg.rol = yo.rol; store.set('cfg', cfg); borrador = {}; mesa = null;
      avisar(`El facilitador te cambió a ${MESAS[yo.mesa][0]}. Ahora estás como ${yo.rol.toLowerCase()}.`);
    }
    const m = await cargarMesa();
    const js = { data: todos.data.filter(j => j.mesa === cfg.mesa) };
    const cambio = !partida || !mesa || p.mes_actual !== partida.mes_actual || m.updated_at !== mesa.updated_at || m.vocero_id !== mesa.vocero_id
      || js.data.map(j => j.nombre).join() !== jugadores.map(j => j.nombre).join();
    partida = p; mesa = m; jugadores = js.data;
    // El rol de vocero lo decide la base de datos; si el facilitador lo cambió, este celular se ajusta
    const esVoc = m.vocero_id === DISPOSITIVO;
    if (cfg.rol === 'Vocero' && !esVoc) { cfg.rol = 'Integrante'; store.set('cfg', cfg); avisar('El facilitador cambió al vocero de tu equipo. Ahora estás como integrante.'); guardarJugador('Integrante'); }
    else if (esVoc && cfg.rol !== 'Vocero') { cfg.rol = 'Vocero'; store.set('cfg', cfg); avisar('El facilitador te asignó como vocero de tu equipo. Ahora tú capturas y envías.'); guardarJugador('Vocero'); }
    if (++tick % 4 === 0) SB.from('caja_jugadores').update({ visto_at: new Date().toISOString() }).eq('partida', cfg.partida).eq('dispositivo', DISPOSITIVO).then(() => {});
    if (cambio || !armado || (aviso && Date.now() > avisoHasta)) { if (Date.now() > avisoHasta) aviso = ''; vistaMesa(); }
    const red = $('#red'); if (red) red.textContent = '';
  } catch (e) { const red = $('#red'); if (red) red.textContent = 'Sin conexión. Reintentando…'; }
}

function tablero(est, mes) {
  const ini = mes <= 5 ? Caja.inicioDeMes(est, mes) : null;
  const fac = est.facturas.slice().sort((a, b) => a.mes - b.mes).map(f => `<div class="row"><span>Factura que se cobra en el mes ${f.mes}</span><b>${money(f.monto)}</b></div>`).join('') || '<div class="row muted">Sin facturas pendientes</div>';
  const av = est.avisos.map(a => `<div class="row"><span>Aviso del proveedor de aluminio, mes ${a.mes}</span><b>${money(a.monto)}</b></div>`).join('') || '<div class="row muted">Sin avisos</div>';
  return `<div class="card">
    <div class="row"><span>Caja en el banco al empezar${mes <= 5 ? ' el mes ' + mes : ''}</span><b>${money(est.caja)}</b></div>
    <div class="row"><span>Crédito del banco por pagar</span><b>${money(est.credito)}</b></div>
    ${ini && est.credito ? `<div class="row"><span>Intereses de este mes ($1 por cada $10)</span><b>${money(ini.intereses)}</b></div>` : ''}
    <h2>Por cobrar</h2>${fac}
    <h2>Por pagar</h2>${av}
    <p class="small muted" style="margin-top:10px">Cifras en millones de pesos.</p>
  </div>`;
}

function historial(est) {
  if (!est.historial.length) return '';
  return `<h2>Lo que llevan</h2><div class="card"><table><tr><th>Mes</th><th>Lotes</th><th>Pronto pago</th><th>Caja final</th><th>Utilidad</th><th>Puntos</th></tr>
  ${est.historial.map(h => `<tr><td>${h.mes}</td><td>${h.decision.lotes}</td><td>${h.decision.pronto || '—'}</td><td>${money(h.resultado.cajaFinal)}</td><td>${money(h.resultado.utilidad)}</td><td>${h.puntos}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td></td><td></td><td><b>${money(est.caja)}</b></td><td><b>${money(est.utilidadAcum)}</b></td><td class="pts">${est.puntos}</td></tr></table></div>`;
}

function avisoUltimo(est) {
  const u = est.ultimo; if (!u) return '';
  if (u.ok) return `<div class="msg ok"><b>Mes ${u.mes}: correcto${u.intento === 2 ? ' en el segundo intento' : ''}.</b> Ganan ${u.puntos} ${u.puntos === 1 ? 'punto' : 'puntos'}.</div>`;
  const r = u.correctos;
  return `<div class="msg warn"><b>Mes ${u.mes}: los números no cuadraron en el segundo intento.</b> Avanzan sin puntos. Estos eran los correctos; anótenlos en su hoja:
    <ul><li>Cobros: ${money(r.cobros)}</li><li>Pago al proveedor: ${money(r.proveedor)}</li><li>Caja al final: ${money(r.cajaFinal)}</li><li>Utilidad: ${money(r.utilidad)}</li></ul></div>`;
}

function avisoPendiente(est, mes) {
  const pe = est.pendiente; if (!pe || pe.mes !== mes) return '';
  return `<div class="msg err"><b>Algo no cuadra. Tienen un segundo intento (vale 1 punto).</b>
    <ul>${pe.fallos.map(c => `<li>${Caja.PISTAS[c](mes)}</li>`).join('')}</ul>
    ${pe.bien.length ? `<p style="margin-top:6px">Ya están bien: ${pe.bien.map(c => CAMPOS[c].toLowerCase()).join(', ')}.</p>` : ''}</div>`;
}

function vistaMesa() {
  armado = true;
  const est = mesa.estado, mes = est.mesCompleto + 1, abierto = partida.mes_actual;
  const esVocero = mesa.vocero_id === DISPOSITIVO, nomVoc = nombreDe(mesa.vocero_id);
  let cuerpo = '';
  if (mes > 5) {
    cuerpo = `<div class="msg info"><b>Terminaron los cinco meses.</b> Utilidad acumulada ${money(est.utilidadAcum)} y caja ${money(est.caja)}${est.credito ? `, con ${money(est.credito)} de crédito por pagar` : ''}. Miren la pantalla: ¿el equipo con más utilidad es el que tiene más caja?</div>`;
  } else if (abierto === 0) {
    cuerpo = `<div class="msg info">Esperen a que el facilitador abra el mes 1. El juego empieza cuando los cinco equipos tienen vocero.${!mesa.vocero_id ? ' <b>Su equipo todavía no tiene vocero:</b> elijan a una persona y que entre con ese rol.' : ''} Mientras, revisen su tablero: esto es lo que tienen hoy.</div>`;
  } else if (mes > abierto) {
    cuerpo = `<div class="msg info">Ya enviaron el mes ${mes - 1}. Esperen a que el facilitador abra el mes ${mes}.</div>`;
  } else {
    const ped = Caja.PEDIDOS[mes];
    cuerpo = `<div class="card"><div class="kick">Mes ${mes} de 5</div>
      <h2 style="margin-top:4px">Este mes les piden ${ped} lotes</h2>
      <p class="small">Cada lote se vende en $10 y cuesta $4 de aluminio y $2 de nómina. El gasto fijo es $2 al mes. El cliente paga a 2 meses; el aluminio se paga al mes siguiente; la nómina y el gasto fijo, este mes.</p>
      ${mes >= 3 ? `<p class="small" style="margin-top:6px"><b>Pronto pago:</b> ${Caja.CLIENTE_NUEVO} de esos lotes son de un cliente nuevo. Si le hacen $1 de descuento por lote, paga en 1 mes en lugar de 2 ($9 por lote).</p>` : ''}
      <p class="small" style="margin-top:6px"><b>Banco:</b> presta en múltiplos de $10. Cobra $1 al mes por cada $10, a partir del mes siguiente.</p></div>
      ${avisoPendiente(est, mes)}
      ${esVocero ? formulario(est, mes) : !mesa.vocero_id ? `<div class="msg err"><b>Su equipo no tiene vocero.</b> Avísenle al facilitador para que asigne uno.</div>`
        : `<div class="msg info">${nomVoc ? `<b>${esc(nomVoc)}</b> es el vocero y` : 'El vocero'} captura la decisión. Ustedes hagan las cuentas en la hoja de caja y revísenlas antes de enviar.</div>`}`;
  }
  app.innerHTML = `
    <header class="top"><div><div class="kick">La caja de la planta</div><div style="margin-top:4px">${mesaTag(cfg.mesa)} <span class="muted small">· ${esc(cfg.nombre || '')} · ${esVocero ? 'Vocero' : esc(cfg.rol)}</span></div>
      <a href="#" class="small" id="salir-arriba">¿Equipo o rol equivocado? Cámbialo aquí</a></div>
      <div style="text-align:right"><div class="pts" style="font-size:22px">${est.puntos}</div><div class="small muted">puntos</div></div></header>
    <div id="red" class="small" style="color:var(--danger)"></div>
    ${aviso && Date.now() < avisoHasta ? `<div class="msg info"><b>${aviso}</b></div>` : ''}
    ${avisoUltimo(est)}
    ${cuerpo}
    ${mes <= 5 ? '<h2>Su tablero</h2>' + tablero(est, mes) : ''}
    ${historial(est)}
    <p class="small muted" style="margin-top:20px">Partida ${cfg.partida} · <a href="#" id="salir">cambiar de equipo o rol</a></p>`;
  $('#salir').onclick = $('#salir-arriba').onclick = e => { e.preventDefault(); clearInterval(timer); vistaUnirse(); };
  if (esVocero && mes <= 5 && mes <= abierto && abierto > 0) armarFormulario(est, mes);
}

function campo(id, lab, extra = '') { return `<label for="${id}">${lab}${extra}</label><input type="number" inputmode="numeric" id="${id}" value="${borrador[id] ?? ''}">`; }

function formulario(est, mes) {
  return `<div class="card"><h2 style="margin-top:0">1. La decisión</h2>
    ${campo('lotes', 'Lotes a producir', ` <small>(de 0 a ${Caja.PEDIDOS[mes]})</small>`)}
    ${mes >= 3 ? campo('pronto', 'Lotes con pronto pago', ` <small>(de 0 a ${Caja.CLIENTE_NUEVO})</small>`) : ''}
    ${campo('pide', 'Crédito que piden al banco', ' <small>($0, $10, $20…)</small>')}
    ${est.credito ? campo('devuelve', 'Crédito que devuelven', ` <small>(deben ${money(est.credito)})</small>`) : ''}
    <h2>2. Sus números de papel</h2>
    ${campo('cobros', CAMPOS.cobros)}${campo('proveedor', CAMPOS.proveedor)}${campo('cajaFinal', CAMPOS.cajaFinal)}${campo('utilidad', CAMPOS.utilidad)}
    <div id="fmsg"></div>
    <button class="btn" id="enviar">Enviar el mes ${mes}</button></div>`;
}

function armarFormulario(est, mes) {
  document.querySelectorAll('input[type=number]').forEach(i => i.oninput = () => { borrador[i.id] = i.value; });
  $('#enviar').onclick = () => enviar(est, mes);
}

async function enviar(est, mes) {
  const v = id => { const el = $('#' + id); return el && el.value.trim() !== '' ? Number(el.value) : (el ? NaN : 0); };
  const d = { lotes: v('lotes'), pronto: v('pronto'), pide: v('pide') || 0, devuelve: v('devuelve') || 0 };
  if (Number.isNaN(d.pronto)) d.pronto = 0;
  const fmsg = t => { $('#fmsg').innerHTML = `<div class="msg err">${t}</div>`; };
  if (Number.isNaN(d.lotes)) return fmsg('Escriban cuántos lotes van a producir.');
  const errD = Caja.validarDecision(est, mes, d); if (errD) return fmsg(errD);
  const nums = { cobros: v('cobros'), proveedor: v('proveedor'), cajaFinal: v('cajaFinal'), utilidad: v('utilidad') };
  if (Object.values(nums).some(Number.isNaN)) return fmsg('Llenen los cuatro números de su hoja.');
  const r = Caja.calcular(est, mes, d);
  if (r.cajaFinal < 0) return fmsg(`Con esa decisión la caja termina en ${money(r.cajaFinal)}: no alcanza para pagar la nómina y al proveedor. Pueden pedir crédito, ofrecer pronto pago o producir menos. Este intento no cuenta.`);
  const fallos = Caja.comparar(r, nums);
  const intento = est.pendiente && est.pendiente.mes === mes ? 2 : 1;
  let nuevo;
  if (!fallos.length) {
    const pts = intento === 1 ? 2 : 1;
    nuevo = Caja.aplicar(est, mes, d, r, pts); nuevo.ultimo = { mes, ok: true, intento, puntos: pts };
  } else if (intento === 1) {
    nuevo = JSON.parse(JSON.stringify(est));
    nuevo.pendiente = { mes, fallos, bien: Object.keys(CAMPOS).filter(c => !fallos.includes(c)) };
  } else {
    nuevo = Caja.aplicar(est, mes, d, r, 0); nuevo.ultimo = { mes, ok: false, intento, correctos: r };
  }
  if (nuevo.mesCompleto === mes) { delete nuevo.pendiente; borrador = {}; }
  enviando = true; $('#enviar').disabled = true;
  try {
    // Solo se guarda si la base de datos confirma que este celular es el vocero del equipo
    const e2 = await SB.from('caja_mesas').update({ estado: nuevo, updated_at: new Date().toISOString() })
      .eq('partida', cfg.partida).eq('mesa', cfg.mesa).eq('vocero_id', DISPOSITIVO).select();
    if (e2.error) throw e2.error;
    if (e2.data.length !== 1) {
      enviando = false; cfg.rol = 'Integrante'; store.set('cfg', cfg); guardarJugador('Integrante');
      avisar('Este celular ya no es el vocero del equipo. El envío no se guardó.');
      mesa = await cargarMesa(); vistaMesa(); window.scrollTo(0, 0); return;
    }
    await SB.from('caja_envios').insert({ partida: cfg.partida, mesa: cfg.mesa, mes, intento, decision: d, numeros: nums, correcto: !fallos.length, fallos });
    mesa = e2.data[0]; enviando = false; vistaMesa(); window.scrollTo(0, 0);
  } catch (e) {
    enviando = false; $('#enviar').disabled = false;
    fmsg('No se pudo enviar. Revisen la conexión e intenten otra vez.');
  }
}

/* ---------- Facilitador ---------- */
let facMesas = [], facJug = [], confirmar = false, gestion = null; // gestion = { mesa, sel }
function bono(mesas) {
  const term = mesas.filter(m => m.estado.mesCompleto === 5);
  if (term.length === 0) return {};
  const max = Math.max(...term.map(m => m.estado.utilidadAcum));
  const out = {}; term.forEach(m => { if (m.estado.utilidadAcum === max) out[m.mesa] = 3; }); return out;
}

async function refrescarFac() {
  try {
    partida = await cargarPartida(cfg.partida);
    const { data } = partida ? await SB.from('caja_mesas').select('*').eq('partida', cfg.partida).order('mesa') : { data: [] };
    const jj = partida ? await SB.from('caja_jugadores').select('*').eq('partida', cfg.partida).order('nombre') : { data: [] };
    facMesas = data || []; facJug = jj.data || []; vistaFac();
  } catch (e) { const red = $('#red'); if (red) red.textContent = 'Sin conexión. Reintentando…'; }
}

function estadoMesa(m, abierto) {
  if (!m) return '<span class="muted">Sin conectar</span>';
  const e = m.estado;
  if (e.mesCompleto >= abierto && abierto > 0) return `<b style="color:var(--ok)">Mes ${e.mesCompleto} enviado</b>`;
  if (e.pendiente && e.pendiente.mes === e.mesCompleto + 1) return `<b style="color:var(--alerta)">Mes ${e.pendiente.mes}: segundo intento</b>`;
  if (abierto === 0) return '<span class="muted">Conectada</span>';
  return `<span>Trabajando el mes ${e.mesCompleto + 1}</span>`;
}

const senal = j => { const s = (Date.now() - new Date(j.visto_at).getTime()) / 1000; return s < 45 ? '' : s < 120 ? 'sin señal hace 1 min' : `sin señal hace ${Math.round(s / 60)} min`; };
function voceroMesa(m) {
  if (!m) return '';
  const j = facJug.find(x => x.dispositivo === m.vocero_id);
  if (!m.vocero_id) return '<div class="s" style="color:var(--danger);font-weight:600">Sin vocero</div>';
  return `<div class="s">Vocero: <b>${j ? esc(j.nombre) : 'sin nombre'}</b>${j && senal(j) ? ` <span style="color:var(--danger)">· ${senal(j)}</span>` : ''}</div>`;
}
function panelVocero() {
  if (!gestion) return '';
  const n = gestion.mesa, m = facMesas.find(x => x.mesa === n), act = m && m.vocero_id;
  const delEquipo = facJug.filter(j => j.mesa === n), lista = delEquipo.filter(j => j.dispositivo !== act);
  const sel = lista.find(j => j.dispositivo === gestion.sel), actual = facJug.find(j => j.dispositivo === act);
  const est = m && m.estado, ult = est && est.historial[est.historial.length - 1];
  let corregir = '';
  if (est && est.pendiente) {
    corregir = `<p class="small">Hay un primer intento fallido del mes ${est.pendiente.mes} esperando el segundo intento.</p>
      ${gestion.deshacer ? `<div class="msg err"><b>¿Borrar el intento pendiente del mes ${est.pendiente.mes} de ${MESAS[n][0]}?</b> El equipo vuelve a tener primer intento en ese mes.</div><div class="bar"><button class="btn danger" id="deshacer-ok">Confirmar: borrar el intento</button><button class="btn ghost" id="deshacer-no">No</button></div>`
        : '<button class="btn sec" id="deshacer" style="width:auto">Borrar el intento pendiente</button>'}`;
  } else if (ult) {
    corregir = `<p class="small">Último mes enviado: <b>mes ${ult.mes}</b> · ${ult.decision.lotes} lotes · caja ${money(ult.resultado.cajaFinal)} · utilidad ${money(ult.resultado.utilidad)} · ${ult.puntos} ${ult.puntos === 1 ? 'punto' : 'puntos'}.</p>
      ${gestion.deshacer ? `<div class="msg err"><b>¿Deshacer el mes ${ult.mes} de ${MESAS[n][0]}?</b> El tablero vuelve a como estaba al empezar ese mes, se quitan sus ${ult.puntos} ${ult.puntos === 1 ? 'punto' : 'puntos'} y el vocero lo puede enviar de nuevo. Los envíos quedan en el reporte marcados como deshechos.</div><div class="bar"><button class="btn danger" id="deshacer-ok">Confirmar: deshacer el mes ${ult.mes}</button><button class="btn ghost" id="deshacer-no">No</button></div>`
        : `<button class="btn sec" id="deshacer" style="width:auto">Deshacer el mes ${ult.mes}</button>`}`;
  } else corregir = '<p class="small muted">Este equipo todavía no ha enviado ningún mes.</p>';
  const otros = n2 => [1, 2, 3, 4, 5].filter(k => k !== n2).map(k => `<option value="${k}">${MESAS[k][0]}</option>`).join('');
  return `<div class="card" style="border-top:6px solid ${MESAS[n][1]}">
    <div class="bar" style="justify-content:space-between"><h2 style="margin:0">Administrar ${MESAS[n][0]}</h2><button class="btn ghost" id="cancelar-gestion">Cerrar</button></div>

    <h3 class="gest">Vocero</h3>
    <p class="small muted">${actual ? `Hoy el vocero es <b>${esc(actual.nombre)}</b>${senal(actual) ? ` (${senal(actual)})` : ''}. Al cambiarlo pasa a integrante y ya no puede enviar.` : 'Este equipo no tiene vocero.'} Elige quién lo reemplaza.</p>
    ${lista.length ? `<div class="chips" id="cand" style="margin-top:10px">${lista.map(j => `<button class="chip${j.dispositivo === gestion.sel ? ' on' : ''}" data-d="${j.dispositivo}" style="${j.dispositivo === gestion.sel ? 'background:var(--carbon)' : ''}">${esc(j.nombre)} <span class="small" style="opacity:.75">· ${esc(j.rol)}${senal(j) ? ' · ' + senal(j) : ''}</span></button>`).join('')}</div>`
      : '<div class="msg info">Nadie más de este equipo ha entrado al simulador. Pídeles que escaneen el QR y vuelve aquí.</div>'}
    ${sel ? `<div class="msg err"><b>¿Hacer vocero a ${esc(sel.nombre)} en ${MESAS[n][0]}?</b> Su celular podrá capturar y enviar en unos segundos.</div>` : ''}
    <div class="bar" style="margin-top:12px">
      ${sel ? `<button class="btn" id="asignar">Confirmar: ${esc(sel.nombre)} es el vocero</button>` : ''}
      ${act ? '<button class="btn sec" id="liberar">Dejar sin vocero</button>' : ''}
    </div>

    <h3 class="gest">Jugadores</h3>
    ${delEquipo.length ? delEquipo.map(j => `<div class="row" style="align-items:center"><span><b>${esc(j.nombre)}</b> <span class="small muted">· ${j.dispositivo === act ? 'Vocero' : esc(j.rol)}${senal(j) ? ' · ' + senal(j) : ''}</span></span>
      <span class="bar"><select class="mover" data-mover="${j.dispositivo}" aria-label="Mover a ${esc(j.nombre)} a otro equipo"><option value="">Mover a…</option>${otros(n)}</select></span></div>`).join('')
      : '<p class="small muted">Nadie ha entrado a este equipo.</p>'}
    <p class="small muted" style="margin-top:6px">Si alguien entró al equipo equivocado, muévelo aquí. Si era el vocero, este equipo se queda sin vocero y en el nuevo entra como integrante.</p>

    <h3 class="gest">Corregir el tablero</h3>
    ${corregir}
  </div>`;
}

function grafica(mesas) {
  const W = 760, H = 300, pad = 40, vals = mesas.flatMap(m => [m.estado.utilidadAcum, m.estado.caja]);
  const max = Math.max(10, ...vals), gw = (W - pad * 2) / mesas.length, bw = Math.min(46, gw / 3), y = v => H - pad - (Math.max(0, v) / max) * (H - pad * 2);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Utilidad acumulada contra caja por equipo"><line x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}" stroke="#BDB9B2"/>`;
  mesas.forEach((m, i) => {
    const x = pad + i * gw + gw / 2, u = m.estado.utilidadAcum, c = m.estado.caja;
    s += `<rect x="${x - bw - 3}" y="${y(u)}" width="${bw}" height="${H - pad - y(u)}" fill="#262626" rx="3"/><text x="${x - bw / 2 - 3}" y="${y(u) - 6}" text-anchor="middle" font-size="15" font-weight="700">${money(u)}</text>`;
    s += `<rect x="${x + 3}" y="${y(c)}" width="${bw}" height="${H - pad - y(c)}" fill="#AA1124" rx="3"/><text x="${x + bw / 2 + 3}" y="${y(c) - 6}" text-anchor="middle" font-size="15" font-weight="700" fill="#AA1124">${money(c)}</text>`;
    s += `<text x="${x}" y="${H - pad + 22}" text-anchor="middle" font-size="14" font-weight="600">${MESAS[m.mesa][0]}</text>`;
  });
  return s + `</svg><p class="small" style="margin-top:6px"><span class="dot" style="background:#262626"></span> Utilidad acumulada &nbsp; <span class="dot" style="background:#AA1124"></span> Caja al final</p>`;
}

function vistaFac() {
  const abierto = partida ? partida.mes_actual : 0, vis = partida && partida.resultados_visibles;
  const porMesa = {}; facMesas.forEach(m => porMesa[m.mesa] = m);
  // El juego empieza solo cuando los cinco equipos tienen vocero
  const faltan = [1, 2, 3, 4, 5].filter(n => !porMesa[n] || !porMesa[n].vocero_id), bloqueado = abierto === 0 && faltan.length > 0;
  const b = bono(facMesas);
  const todos = facMesas.length && facMesas.every(m => m.estado.mesCompleto === 5);
  const tabla = facMesas.slice().sort((a, c) => (c.estado.puntos + (b[c.mesa] || 0)) - (a.estado.puntos + (b[a.mesa] || 0)));
  const url = location.origin + location.pathname + '?p=' + encodeURIComponent(cfg.partida);
  app.innerHTML = `
  <header class="top"><div><div class="kick">Finanzas para No Financieros · Sesión 2 · Vista del facilitador</div><h1>La caja de la planta</h1></div>
    <div class="bar"><input type="text" id="cod" value="${cfg.partida}" style="width:150px;font-size:16px">
    <button class="btn ghost" id="cargar">Cargar</button>
    <button class="btn ${!partida ? '' : (confirmar ? 'danger' : 'sec')}" id="reset">${partida ? (confirmar ? 'Confirmar: se borra todo' : 'Reiniciar partida') : 'Crear partida'}</button></div></header>
  <div id="red" class="small" style="color:var(--danger)"></div>
  ${!partida ? '<div class="msg info">Esta partida no existe todavía. Créenla con el botón de arriba.</div>' : `
  <div class="cols"><div>
    <div class="bar">
      <div style="font-size:22px;font-weight:700;margin-right:12px">${abierto === 0 ? 'Sin empezar' : 'Mes ' + abierto + ' de 5'}</div>
      ${abierto < 5 ? `<button class="btn" id="abrir"${bloqueado ? ' disabled' : ''}>Abrir mes ${abierto + 1}</button>` : ''}
      <button class="btn ghost" id="vis">${vis ? 'Ocultar cifras' : 'Mostrar cifras'}</button>
      <button class="btn ghost" id="desc-html">Descargar resultados</button>
      <button class="btn ghost" id="desc-csv">Datos en CSV</button>
    </div>
    ${bloqueado ? `<div class="msg warn"><b>Para empezar, cada equipo necesita un vocero.</b> Falta${faltan.length > 1 ? 'n' : ''}: ${faltan.map(n => MESAS[n][0]).join(', ')}. Pide que alguien de ${faltan.length > 1 ? 'cada uno' : 'ese equipo'} entre como vocero o asígnalo en «Administrar equipo».</div>` : ''}
    ${confirmar ? '<div class="msg err"><b>Reiniciar borra todos los datos de esta partida.</b> Si no los has guardado, descarga antes los resultados. Para cancelar, toca «Cargar».</div>' : ''}
    <div id="desc-msg" class="small muted" style="margin-top:8px"></div>
    <div class="grid5">${[1,2,3,4,5].map(n => `<div class="st" style="border-top-color:${MESAS[n][1]}"><div class="n">${MESAS[n][0]}</div><div class="s">${estadoMesa(porMesa[n], abierto)}</div>${voceroMesa(porMesa[n])}
      ${porMesa[n] ? `<button class="mini" data-gestion="${n}">Administrar equipo</button>` : ''}</div>`).join('')}</div>
    ${panelVocero()}
    ${vis && facMesas.length ? `<h2>Cómo van</h2><div class="card"><table><tr><th>Equipo</th><th>Caja</th><th>Utilidad acumulada</th><th>Crédito</th><th>Puntos</th></tr>
      ${tabla.map(m => `<tr><td>${mesaTag(m.mesa)}</td><td>${money(m.estado.caja)}</td><td>${money(m.estado.utilidadAcum)}</td><td>${money(m.estado.credito)}</td><td class="pts">${m.estado.puntos + (b[m.mesa] || 0)}${b[m.mesa] ? ' <span class="small muted">(+3 mayor utilidad)</span>' : ''}</td></tr>`).join('')}</table></div>` : ''}
    ${vis && todos ? `<h2>¿El equipo que más ganó es el que más caja tiene?</h2><div class="card">${grafica(facMesas)}</div>` : ''}
  </div>
  <div><div id="qr"></div><p class="small" style="margin-top:8px">Escaneen para entrar. Código: <b>${cfg.partida}</b></p><p class="small muted" style="word-break:break-all">${url}</p></div></div>`}`;
  if (partida && window.QRCode) new QRCode($('#qr'), { text: url, width: 260, height: 260, colorDark: '#1F1F1F', colorLight: '#ffffff' });
  $('#cargar').onclick = () => { const c = $('#cod').value.trim().toUpperCase(); if (!/^[A-Z0-9-]{2,20}$/.test(c)) return; cfg.partida = c; store.set('cfg', cfg); confirmar = false; refrescarFac(); };
  $('#reset').onclick = async () => {
    const c = $('#cod').value.trim().toUpperCase(); if (!/^[A-Z0-9-]{2,20}$/.test(c)) return;
    if (partida && !confirmar) { confirmar = true; return vistaFac(); }
    confirmar = false; cfg.partida = c; store.set('cfg', cfg);
    await SB.from('caja_envios').delete().eq('partida', c);
    await SB.from('caja_jugadores').delete().eq('partida', c);
    await SB.from('caja_mesas').delete().eq('partida', c);
    await SB.from('caja_partidas').upsert({ codigo: c, mes_actual: 0, resultados_visibles: false, updated_at: new Date().toISOString() }, { onConflict: 'codigo' });
    refrescarFac();
  };
  const ab = $('#abrir'); if (ab) ab.onclick = async () => { if (bloqueado) return; await SB.from('caja_partidas').update({ mes_actual: abierto + 1, updated_at: new Date().toISOString() }).eq('codigo', cfg.partida); refrescarFac(); };
  document.querySelectorAll('[data-gestion]').forEach(b => b.onclick = () => { gestion = { mesa: +b.dataset.gestion, sel: null, deshacer: false }; vistaFac(); });
  const cand = $('#cand'); if (cand) cand.onclick = e => { const b = e.target.closest('[data-d]'); if (b) { gestion.sel = b.dataset.d; vistaFac(); } };
  const cg = $('#cancelar-gestion'); if (cg) cg.onclick = () => { gestion = null; vistaFac(); };
  const asg = $('#asignar'); if (asg) asg.onclick = () => cambiarVocero(gestion.mesa, gestion.sel);
  document.querySelectorAll('[data-mover]').forEach(sl => sl.onchange = () => { if (sl.value) moverJugador(sl.dataset.mover, +sl.value); });
  const dz = $('#deshacer'); if (dz) dz.onclick = () => { gestion.deshacer = true; vistaFac(); };
  const dn = $('#deshacer-no'); if (dn) dn.onclick = () => { gestion.deshacer = false; vistaFac(); };
  const dk = $('#deshacer-ok'); if (dk) dk.onclick = () => deshacer(gestion.mesa);
  const lib = $('#liberar'); if (lib) lib.onclick = () => cambiarVocero(gestion.mesa, null);
  const dh = $('#desc-html'); if (dh) dh.onclick = () => exportar('html');
  const dc = $('#desc-csv'); if (dc) dc.onclick = () => exportar('csv');
  const vb = $('#vis'); if (vb) vb.onclick = async () => { await SB.from('caja_partidas').update({ resultados_visibles: !vis }).eq('codigo', cfg.partida); refrescarFac(); };
}

async function moverJugador(disp, destino) {
  const j = facJug.find(x => x.dispositivo === disp); if (!j) return;
  try {
    const origen = facMesas.find(x => x.mesa === j.mesa);
    if (origen && origen.vocero_id === disp) await SB.from('caja_mesas').update({ vocero_id: null, vocero_desde: null }).eq('partida', cfg.partida).eq('mesa', j.mesa).eq('vocero_id', disp);
    // El equipo de destino se crea si nadie había entrado todavía
    await SB.from('caja_mesas').upsert({ partida: cfg.partida, mesa: destino, estado: Caja.estadoInicial() }, { onConflict: 'partida,mesa', ignoreDuplicates: true });
    const r = await SB.from('caja_jugadores').update({ mesa: destino, rol: j.rol === 'Vocero' ? 'Integrante' : j.rol }).eq('partida', cfg.partida).eq('dispositivo', disp);
    if (r.error) throw r.error;
    gestion.sel = null; await refrescarFac();
  } catch (e) { const red = $('#red'); if (red) red.textContent = 'No se pudo mover al jugador. Revisa la conexión e inténtalo otra vez.'; }
}

// Rehace el tablero con el historial sin el último mes (o solo borra el intento pendiente)
async function deshacer(n) {
  const m = facMesas.find(x => x.mesa === n); if (!m) return;
  const est = m.estado; let nuevo, mesDeshecho;
  if (est.pendiente) { mesDeshecho = est.pendiente.mes; nuevo = JSON.parse(JSON.stringify(est)); delete nuevo.pendiente; delete nuevo.ultimo; }
  else {
    const h = est.historial; if (!h.length) return; mesDeshecho = h[h.length - 1].mes;
    nuevo = Caja.estadoInicial();
    h.slice(0, -1).forEach(x => { nuevo = Caja.aplicar(nuevo, x.mes, x.decision, x.resultado, x.puntos); });
  }
  try {
    const r = await SB.from('caja_mesas').update({ estado: nuevo, updated_at: new Date().toISOString() }).eq('partida', cfg.partida).eq('mesa', n);
    if (r.error) throw r.error;
    await SB.from('caja_envios').update({ deshecho: true }).eq('partida', cfg.partida).eq('mesa', n).eq('mes', mesDeshecho);
    gestion.deshacer = false; await refrescarFac();
  } catch (e) { const red = $('#red'); if (red) red.textContent = 'No se pudo deshacer. Revisa la conexión e inténtalo otra vez.'; }
}

async function cambiarVocero(n, nuevo) {
  const m = facMesas.find(x => x.mesa === n), antes = m && m.vocero_id;
  try {
    const r = await SB.from('caja_mesas').update({ vocero_id: nuevo, vocero_desde: nuevo ? new Date().toISOString() : null }).eq('partida', cfg.partida).eq('mesa', n);
    if (r.error) throw r.error;
    if (antes) await SB.from('caja_jugadores').update({ rol: 'Integrante' }).eq('partida', cfg.partida).eq('dispositivo', antes);
    if (nuevo) await SB.from('caja_jugadores').update({ rol: 'Vocero' }).eq('partida', cfg.partida).eq('dispositivo', nuevo);
    gestion = null; refrescarFac();
  } catch (e) { const red = $('#red'); if (red) red.textContent = 'No se pudo cambiar el vocero. Revisa la conexión e inténtalo otra vez.'; }
}

async function exportar(tipo) {
  const m = $('#desc-msg'); if (m) m.textContent = 'Preparando la descarga…';
  try {
    const p = await cargarPartida(cfg.partida); if (!p) throw new Error('sin partida');
    const r1 = await SB.from('caja_mesas').select('*').eq('partida', cfg.partida).order('mesa'); if (r1.error) throw r1.error;
    const r2 = await SB.from('caja_envios').select('*').eq('partida', cfg.partida).order('created_at'); if (r2.error) throw r2.error;
    const hoy = new Date().toISOString().slice(0, 10), base = `resultados_caja_${cfg.partida}_${hoy}`;
    const r3 = await SB.from('caja_jugadores').select('*').eq('partida', cfg.partida).order('nombre');
    const datos = { partida: p, mesas: r1.data || [], envios: r2.data || [], jugadores: r3.data || [], EQ: MESAS, origen: location.origin };
    if (tipo === 'csv') CajaExportar.descargar(base + '.csv', CajaExportar.csv(datos), 'text/csv;charset=utf-8');
    else CajaExportar.descargar(base + '.html', CajaExportar.html(datos), 'text/html;charset=utf-8');
    if ($('#desc-msg')) $('#desc-msg').textContent = 'Listo: revisa tu carpeta de descargas.';
  } catch (e) { if ($('#desc-msg')) $('#desc-msg').textContent = 'No se pudo descargar. Revisa la conexión e inténtalo otra vez.'; }
}

/* ---------- PIN del facilitador (CodeSlots de React Bits, portado a JS + CSS) ---------- */
const PIN_HASH = '9f8a7a998fbd6cef928d4188e1106a4eed7fca9c36d394decd0ade8290fd79fc';
const PIN_KEY = 'mt-caja-facilitador', PIN_MS = 12 * 60 * 60 * 1000;
function pinValido() {
  try { const d = JSON.parse(localStorage.getItem(PIN_KEY) || 'null'); if (d && d.h === PIN_HASH && Date.now() < d.exp) return true; } catch (e) {}
  return false;
}
function vistaPin(alEntrar) {
  const LENGTH = 6, CASCADE = 20, SETTLE = 300;
  app.innerHTML = `<section class="pin" id="pin">
    <div class="kick">Vista del facilitador</div>
    <p class="pin__title" id="pin-title">Ingresa el PIN del facilitador</p>
    <div class="code-slots"><div class="code-slots__row" id="slots" data-status="idle">
      <input class="code-slots__input" id="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" aria-labelledby="pin-title" aria-describedby="pin-status" autofocus>
      <span class="code-slots__wash" aria-hidden="true"><span class="code-slots__check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14l3.5 3.5L19 7"/></svg></span></span>
      <span class="code-slots__caret" aria-hidden="true"><span class="code-slots__caret-line"></span></span>
    </div></div>
    <p class="pin__msg" id="pin-msg"></p><span class="sr-only" id="pin-status" aria-live="polite"></span></section>`;
  const gate = $('#pin'), row = $('#slots'), input = $('#pin-input'), caret = row.querySelector('.code-slots__caret'), msg = $('#pin-msg'), status = $('#pin-status');
  const slots = [], chars = []; let active = 0, state = 'idle', focused = false;
  for (let i = 0; i < LENGTH; i++) {
    const sl = document.createElement('span'); sl.className = 'code-slots__slot'; sl.setAttribute('aria-hidden', 'true');
    sl.innerHTML = '<span class="code-slots__fill"></span><span class="code-slots__digit"></span>';
    sl.style.setProperty('--sd', (60 + i * 30) + 'ms'); row.insertBefore(sl, row.querySelector('.code-slots__wash')); slots.push(sl); chars.push('');
  }
  const clean = r => String(r || '').replace(/[^0-9]/g, '');
  const firstEmpty = () => { const k = chars.indexOf(''); return k === -1 ? LENGTH - 1 : k; };
  function render() {
    slots.forEach((sl, k) => sl.toggleAttribute('data-active', focused && k === active && state === 'idle'));
    caret.style.setProperty('--a', active);
    caret.toggleAttribute('data-show', focused && state === 'idle' && !chars[active]);
    status.textContent = state === 'success' ? 'PIN aceptado' : chars.filter(Boolean).length + ' de ' + LENGTH + ' dígitos';
  }
  function land(k, ch, delay) { const sl = slots[k]; sl.style.setProperty('--d', delay + 'ms'); if (sl.hasAttribute('data-filled')) { sl.removeAttribute('data-filled'); void sl.offsetWidth; } sl.querySelector('.code-slots__digit').textContent = ch; sl.setAttribute('data-filled', ''); }
  function clearSlot(k, delay) { slots[k].style.setProperty('--d', (delay || 0) + 'ms'); slots[k].removeAttribute('data-filled'); chars[k] = ''; }
  function insert(raw, from) {
    const c = clean(raw); if (!c || state !== 'idle') return;
    if (msg.dataset.tone) { msg.textContent = ''; delete msg.dataset.tone; }
    let k = from === undefined ? active : from;
    for (let j = 0; j < c.length && k < LENGTH; j++, k++) { chars[k] = c[j]; land(k, c[j], j * CASCADE); }
    active = Math.min(k, LENGTH - 1); render();
    if (chars.every(Boolean)) verify(chars.join(''));
  }
  async function sha256(t) { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join(''); }
  async function verify(code) { state = 'checking'; render(); let h = ''; try { h = await sha256(code); } catch (e) {} h === PIN_HASH ? succeed() : fail(); }
  function succeed() {
    state = 'success'; row.dataset.status = 'success'; input.blur(); input.readOnly = true; msg.textContent = ''; render();
    try { localStorage.setItem(PIN_KEY, JSON.stringify({ h: PIN_HASH, exp: Date.now() + PIN_MS })); } catch (e) {}
    setTimeout(() => { gate.setAttribute('data-leaving', ''); setTimeout(alEntrar, 400); }, 900);
  }
  function fail() {
    state = 'error'; row.dataset.status = 'error'; msg.dataset.tone = 'error'; msg.textContent = 'PIN incorrecto. Inténtalo de nuevo.'; render();
    setTimeout(() => {
      const filled = []; chars.forEach((c, k) => { if (c) filled.push(k); });
      filled.reverse().forEach((k, n) => clearSlot(k, n * CASCADE)); active = 0; caret.style.setProperty('--a', 0);
      setTimeout(() => { state = 'idle'; row.dataset.status = 'idle'; render(); }, (filled.length - 1) * CASCADE + SETTLE);
    }, 450);
  }
  input.addEventListener('keydown', e => {
    if (state !== 'idle' || e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key;
    if (/^[0-9]$/.test(key)) { e.preventDefault(); insert(key); }
    else if (key === 'Backspace') { e.preventDefault(); if (chars[active]) clearSlot(active); else if (active > 0) { active -= 1; clearSlot(active); } render(); }
    else if (key === 'Delete') { e.preventDefault(); clearSlot(active); render(); }
    else if (key === 'ArrowLeft') { e.preventDefault(); active = Math.max(active - 1, 0); render(); }
    else if (key === 'ArrowRight') { e.preventDefault(); active = Math.min(active + 1, firstEmpty()); render(); }
  });
  input.addEventListener('input', () => { const v = input.value; input.value = ''; if (state !== 'idle') return; const c = clean(v); if (c) insert(c, c.length === 1 ? active : 0); });
  input.addEventListener('paste', e => { e.preventDefault(); if (state === 'idle') insert(e.clipboardData.getData('text'), 0); });
  input.addEventListener('focus', () => { focused = true; render(); });
  input.addEventListener('blur', () => { focused = false; render(); });
  row.addEventListener('mousedown', e => {
    e.preventDefault();
    if (state === 'idle') { const rect = row.getBoundingClientRect(); active = Math.max(0, Math.min(Math.floor((e.clientX - rect.left) / (rect.width / LENGTH)), firstEmpty())); }
    input.focus(); render();
  });
  render(); input.focus();
}

function iniciarFac() { refrescarFac(); setInterval(() => { if (!confirmar && !gestion && document.activeElement?.id !== 'cod') refrescarFac(); }, 3000); }
if (FAC) { document.body.classList.add('fac'); pinValido() ? iniciarFac() : vistaPin(iniciarFac); }
else if (cfg.mesa && cfg.rol && cfg.partida) iniciarMesa();
else vistaUnirse();
</script>
